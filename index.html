:root{--bg:#141414;--card:#1e1e1e;--card2:#252525;--line:#2c2c2c;--text:#e8e6e3;--muted:#9a968f;--accent:#c9a227;--link:#7fb3ff;

body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:32px 16px 64px}
h1{margin:0 0 4px;font-size:26px}
h2{margin:0 0 8px;font-size:17px;font-weight:600}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}

ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}

<script>
// Mod List Exporter writes modlist_data.txt next to this page (window.MODLIST = {...}).
// Depending on how the game resolves the mod folder it may land one level up or down,
// so try the likely spots in order and use the first one that loads. A downloaded
// ModList.html has the list built in instead, so it works anywhere it's opened.
var CANDIDATES = [
  "modlist_data.txt", "../modlist_data.txt",
  "42/modlist_data.txt", "common/modlist_data.txt",
  "../42/modlist_data.txt", "../common/modlist_data.txt"
];
var WS = "https://steamcommunity.com/sharedfiles/filedetails/?id=";
var STEAM_APP = "steam://url/CommunityFilePage/";
var NEW_COLLECTION = "https://steamcommunity.com/sharedfiles/editcollection/?appid=108600";
var PAGE_SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function $(id){ return document.getElementById(id); }

// ------------------------------------------------------------------ list

function renderList(data){
  var mods = data.mods || [];
  var rows = [], modIds = [], wids = [], seen = {};
  mods.forEach(function(m){
    var name;
    if (m.workshopId) {
      name = '<a href="' + WS + m.workshopId + '" target="_blank" rel="noopener">' + esc(m.name) + '</a>';
      if (!seen[m.workshopId]) { seen[m.workshopId] = 1; wids.push(m.workshopId); }
    } else {
      name = '<span>' + esc(m.name) + '</span><span class="tag">local, no Workshop page</span>';
    }
    modIds.push("\\" + m.id);
    rows.push('<li><span class="n">' + m.order + '</span><div class="body"><div class="name">' + name +
      '</div><div class="meta">' +
      (m.author ? 'by ' + esc(m.author) + ' &middot; ' : '') +
      (m.version ? 'v' + esc(String(m.version).replace(/^v/i, '')) + ' &middot; ' : '') +
      'Mod ID: ' + esc(m.id) +
      (m.workshopId ? ' &middot; Workshop ID: ' + esc(m.workshopId) : '') + '</div></div></li>');
  });
  return {
    sub: mods.length + ' mods in load order' + (data.exported ? ' &middot; exported ' + esc(data.exported) : ''),
    list: '<ol>' + rows.join('') + '</ol>',
    config: '<details><summary>Server config lines</summary>' +
      '<label>Mods=</label><textarea readonly>Mods=' + esc(modIds.join(';')) + '</textarea>' +
      '<label>WorkshopItems=</label><textarea readonly>WorkshopItems=' + esc(wids.join(';')) + '</textarea></details>'
  };
}

// --------------------------------------------------------------- copying

function copyText(text, btn, ta, label){
  label = label || btn.textContent;
  function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = label; }, 1500); }
  function fallback(){
    var t = ta;
    if (!t) { t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); }
    t.select(); document.execCommand("copy");
    if (!ta) t.remove();
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

// Import code: what the in-game Import button reads from the clipboard.
//   PZMODLIST 1
//   exported=<date>
//   collection=<Steam collection id>   (optional)
//   <workshopId>|<modId>|<name>     (one per mod, in load order)
function importCode(data){
  var lines = ["PZMODLIST 1"];
  if (data.exported) lines.push("exported=" + data.exported);
  if (data.collection) lines.push("collection=" + data.collection);
  (data.mods || []).forEach(function(m){
    lines.push((m.workshopId || "") + "|" + m.id + "|" + String(m.name || "").replace(/[|\r\n]+/g, " "));
  });
  return lines.join("\n") + "\n";
}

// Discord: [Name](<url>) = clickable name, no preview card. 2000 chars per message.
var DISCORD_LIMIT = 1900;
function discordEscape(s){ return String(s == null ? "" : s).replace(/([\[\]*_~`|\\>])/g, "\\$1"); }
function discordParts(data){
  var mods = data.mods || [];
  var lines = mods.map(function(m){
    return m.workshopId
      ? m.order + ". [" + discordEscape(m.name) + "](<" + WS + m.workshopId + ">)"
      : m.order + ". " + discordEscape(m.name) + " *(local mod, no Workshop page)*";
  });
  var collLine = data.collection ? "Steam collection (subscribe to all): <" + WS + data.collection + ">" : "";
  var bodies = [], cur = [], size = 0, headerRoom = 80 + (collLine ? collLine.length + 1 : 0);
  lines.forEach(function(line){
    if (size + line.length + 1 > DISCORD_LIMIT - headerRoom && cur.length) { bodies.push(cur.join("\n")); cur = []; size = 0; }
    cur.push(line); size += line.length + 1;
  });
  if (cur.length) bodies.push(cur.join("\n"));
  return bodies.map(function(body, i){
    var head = "**Project Zomboid mod list** (" + mods.length + " mods, load order)";
    if (bodies.length > 1) head += " - part " + (i + 1) + "/" + bodies.length;
    if (i === 0 && collLine) head += "\n" + collLine;
    return head + "\n" + body;
  });
}
function discordHtml(parts){
  return '<div class="panel" id="parts"><h2>Copy for Discord</h2><p class="sub" style="margin:0">Paste each part as its own Discord message.</p>' +
    parts.map(function(p, i){
      return '<div class="part"><div class="head"><span>Part ' + (i + 1) + ' of ' + parts.length +
        ' &middot; ' + p.length + ' characters</span><button data-i="' + i + '">Copy</button></div>' +
        '<textarea readonly rows="6">' + esc(p) + '</textarea></div>';
    }).join('') + '</div>';
}

// The downloaded page is this same viewer with the list built in, so whoever
// you send it to also gets Compare, Copy import code and Copy for Discord.
var DEFAULT_TITLE = "Project Zomboid Mod List";
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function listTitle(data){ return (data.title && String(data.title).trim()) || DEFAULT_TITLE; }

// "2026-11-02 08:14" -> "Nov 2, 2026"
function niceDate(s){
  var m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? MONTHS[+m[2] - 1] + " " + (+m[3]) + ", " + m[1] : "";
}

// The text Discord (and other sites) show when the hosted page's link is pasted.
function previewInfo(data){
  var mods = data.mods || [];
  var names = mods.slice(0, 3).map(function(m){ return m.name; });
  var rest = mods.length - names.length, lead = "";
  if (names.length) {
    lead = rest > 0 ? names.join(", ") + " and " + rest + " more."
      : names.length === 1 ? names[0] + "."
      : names.slice(0, -1).join(", ") + " and " + names[names.length - 1] + ".";
  }
  var date = niceDate(data.exported);
  return {
    title: listTitle(data) + ": " + mods.length + (mods.length === 1 ? " mod" : " mods"),
    description: "Project Zomboid load order" + (date ? ", exported " + date : "") + ". " + lead +
      " Open to see every mod with its Steam Workshop link, compare with your list, or copy an import code." +
      (data.collection ? " Includes a Steam collection to subscribe to all." : "")
  };
}

function headTags(data){
  var p = previewInfo(data);
  return '<title>' + esc(p.title) + '</title>\n' +
    '<meta name="description" content="' + esc(p.description) + '">\n' +
    '<meta property="og:type" content="website">\n' +
    '<meta property="og:site_name" content="Mod List Exporter">\n' +
    '<meta property="og:title" content="' + esc(p.title) + '">\n' +
    '<meta property="og:description" content="' + esc(p.description) + '">\n' +
    '<meta name="theme-color" content="#c9a227">';
}

function standalonePage(data){
  var json = JSON.stringify(data).replace(/</g, "\\u003c");
  // If this page was itself a download, drop its old built-in list and preview tags first.
  // Only the <head> is edited, so this page's own script text is never touched.
  var cut = PAGE_SOURCE.indexOf("</head>");
  var head = PAGE_SOURCE.slice(0, cut)
    .replace(/\n?<meta (?:name="description"|property="og:[a-z_]+"|name="theme-color")[^>]*>/g, "")
    .replace(/<title>[\s\S]*?<\/title>/, headTags(data));
  var rest = PAGE_SOURCE.slice(cut).replace(/\n?<script>window\.MODLIST = [\s\S]*?;<\/script>/, "");
  return head + rest.replace("<body>", "<body>\n<script>window.MODLIST = " + json + ";<\/script>");
}
var NAME_KEY = "modlistexporter.listName", INDEX_KEY = "modlistexporter.asIndex";
var COLL_KEY = "modlistexporter.collection", ADDED_KEY = "modlistexporter.added", LINK_KEY = "modlistexporter.linkMode";
function load(key){ try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
function store(key, v){ try { localStorage.setItem(key, v); } catch (e) {} }

function download(data, filename){
  var blob = new Blob([standalonePage(data)], {type: "text/html"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename || "ModList.html";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// --------------------------------------------------------------- parsing
// Reads someone else's list from any of: an import code, a Discord post,
// a Mods= server line, a ModList.html (new or old), or modlist_data.txt.
// Returns [{order, id?, name, workshopId?}] or null.

function unescapeDiscord(s){ return s.replace(/\\(.)/g, "$1"); }
function lastPart(id){ id = String(id).trim(); var i = id.lastIndexOf("\\"); return i >= 0 ? id.slice(i + 1) : id; }

function parseList(text){
  text = String(text || "");
  if (!text.trim()) return null;

  // modlist_data.txt or a downloaded ModList.html
  var m = text.match(/window\.MODLIST\s*=\s*(\{[\s\S]*?\})\s*;\s*(?:<\/script>|$)/);
  if (m) { try { var d = JSON.parse(m[1]); if (d.mods) return d.mods; } catch (e) {} }

  var lines = text.split(/\r?\n/), out = [];

  // Import code
  if (/^\s*PZMODLIST\b/.test(text)) {
    lines.slice(1).forEach(function(l){
      if (!l.trim() || /^exported=/.test(l)) return;
      var p = l.split("|");
      if (p.length < 2) return;
      out.push({ order: out.length + 1, workshopId: p[0].trim() || null, id: lastPart(p[1]), name: p.slice(2).join("|").trim() || lastPart(p[1]) });
    });
    return out.length ? out : null;
  }

  // Mods= line from a server .ini (gives IDs and order)
  var ml = text.match(/^\s*Mods\s*=\s*(.+)$/m);
  if (ml) {
    ml[1].split(";").forEach(function(id){
      id = lastPart(id);
      if (id) out.push({ order: out.length + 1, id: id, name: id, workshopId: null });
    });
    if (out.length) return out;
  }

  // Discord post (one or several parts pasted together)
  lines.forEach(function(l){
    var a = l.match(/^\s*(\d+)\.\s+\[(.+)\]\(<?https?:\/\/steamcommunity\.com\/sharedfiles\/filedetails\/\?id=(\d+)>?\)/);
    if (a) { out.push({ order: +a[1], name: unescapeDiscord(a[2]), workshopId: a[3], id: null }); return; }
    var b = l.match(/^\s*(\d+)\.\s+(.+?)\s+\*\(local mod/);
    if (b) out.push({ order: +b[1], name: unescapeDiscord(b[2]), workshopId: null, id: null });
  });
  if (out.length) {
    out.sort(function(x, y){ return x.order - y.order; });
    out.forEach(function(x, i){ x.order = i + 1; });
    return out;
  }

  // Older ModList.html (plain page, no built-in data)
  if (/<li[\s>]/i.test(text)) {
    var doc = new DOMParser().parseFromString(text, "text/html");
    Array.prototype.forEach.call(doc.querySelectorAll("ol li"), function(li){
      var nameEl = li.querySelector(".name a, .name span");
      var meta = (li.querySelector(".meta") || {}).textContent || "";
      var idm = meta.match(/Mod ID:\s*([^\s·]+)/);
      var link = li.querySelector(".name a");
      var wm = link && link.href.match(/[?&]id=(\d+)/);
      if (nameEl) out.push({ order: out.length + 1, name: nameEl.textContent.trim(), id: idm ? idm[1] : null, workshopId: wm ? wm[1] : null });
    });
    return out.length ? out : null;
  }
  return null;
}

// -------------------------------------------------------------- comparing

function compareLists(mine, theirs){
  var used = {}, pairs = [], missing = [], byId = {}, byWid = {};
  mine.forEach(function(m, i){
    if (m.id) byId[m.id.toLowerCase()] = i;
    if (m.workshopId) (byWid[m.workshopId] = byWid[m.workshopId] || []).push(i);
  });
  var norm = function(s){ return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); };

  theirs.forEach(function(t, ti){
    var hit = -1;
    if (t.id && byId[t.id.toLowerCase()] != null && !used[byId[t.id.toLowerCase()]]) hit = byId[t.id.toLowerCase()];
    if (hit < 0 && t.workshopId && byWid[t.workshopId]) {
      var c = byWid[t.workshopId].filter(function(i){ return !used[i]; });
      var named = c.filter(function(i){ return norm(mine[i].name) === norm(t.name); });
      hit = named.length ? named[0] : (c.length ? c[0] : -1);
    }
    if (hit < 0 && !t.id && !t.workshopId) {
      for (var i = 0; i < mine.length; i++) if (!used[i] && norm(mine[i].name) === norm(t.name)) { hit = i; break; }
    }
    if (hit >= 0) { used[hit] = true; pairs.push({ mine: hit, theirs: ti }); }
    else missing.push(ti);
  });
  var extra = [];
  mine.forEach(function(m, i){ if (!used[i]) extra.push(i); });

  // "Different order": the fewest shared mods that would have to move so both
  // lists agree (longest increasing subsequence of their positions in my order).
  pairs.sort(function(a, b){ return a.mine - b.mine; });
  var seq = pairs.map(function(p){ return p.theirs; });
  var tails = [], prev = new Array(seq.length), idx = [];
  seq.forEach(function(v, i){
    var lo = 0, hi = tails.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; if (seq[tails[mid]] < v) lo = mid + 1; else hi = mid; }
    prev[i] = lo > 0 ? tails[lo - 1] : -1;
    tails[lo] = i;
  });
  var keep = {}, k = tails.length ? tails[tails.length - 1] : -1;
  while (k >= 0) { keep[k] = true; k = prev[k]; }
  var moved = {};
  pairs.forEach(function(p, i){ p.moved = !keep[i]; if (p.moved) moved[p.mine] = p; });

  var mineState = {}, theirState = {};
  pairs.forEach(function(p){ mineState[p.mine] = p; theirState[p.theirs] = p; });
  return { pairs: pairs, missing: missing, extra: extra, moved: pairs.filter(function(p){ return p.moved; }),
           mineState: mineState, theirState: theirState };
}

function linkMode(){ return load(LINK_KEY) === "browser" ? "browser" : "steam"; }

// In Compare, links open in the Steam app or the browser, whichever the viewer picked.
function modLink(m){
  if (!m.workshopId) return esc(m.name);
  if (linkMode() === "steam")
    return '<a href="' + STEAM_APP + m.workshopId + '" title="Opens in the Steam app">' + esc(m.name) + '</a>';
  return '<a href="' + WS + m.workshopId + '" target="_blank" rel="noopener">' + esc(m.name) + '</a>';
}

function renderCompare(mine, theirs, r, view){
  var html = '<div class="stats">' +
    '<div class="stat"><b>' + r.pairs.length + '</b><span>In both</span></div>' +
    '<div class="stat"><b class="c-miss">' + r.missing.length + '</b><span>You\'re missing</span></div>' +
    '<div class="stat"><b class="c-extra">' + r.extra.length + '</b><span>Only you have</span></div>' +
    '<div class="stat"><b class="c-move">' + r.moved.length + '</b><span>Different order</span></div></div>' +
    '<div class="bar"><button id="v-side" class="' + (view === "side" ? "on" : "") + '">Side by side</button>' +
    '<button id="v-sum" class="' + (view === "sum" ? "on" : "") + '">Summary only</button>' +
    (r.missing.length ? '<button id="cp-miss">Copy missing links</button>' : '') + '</div>' +
    '<div class="linkmode">Open links in <span class="seg"><button id="lm-steam" class="' + (linkMode() === "steam" ? "on" : "") + '">Steam app</button>' +
    '<button id="lm-browser" class="' + (linkMode() === "browser" ? "on" : "") + '">Browser</button></span></div>';

  if (view === "side") {
    var col = function(title, list, state, side){
      return '<div class="cl"><div class="h">' + title + ' (' + list.length + ')</div>' + list.map(function(m, i){
        var p = state[i], pill;
        if (!p) pill = side === "mine" ? '<span class="pill p-extra">only you</span>' : '<span class="pill p-miss">you\'re missing</span>';
        else if (p.moved) pill = '<span class="pill p-move">' + (side === "mine" ? 'theirs: ' + (p.theirs + 1) : 'yours: ' + (p.mine + 1)) + '</span>';
        else pill = '<span class="pill p-ok">same</span>';
        return '<div class="cr"><span class="i">' + (i + 1) + '</span><span class="t">' + modLink(m) + '</span>' + pill + '</div>';
      }).join('') + '</div>';
    };
    html += '<div class="cols">' + col("Your list", mine, r.mineState, "mine") + col("Their list", theirs, r.theirState, "theirs") + '</div>';
  } else {
    var sec = function(cls, title, items){
      return '<div class="sec"><h2 class="' + cls + '">' + title + '</h2>' +
        (items.length ? '<ul>' + items.join('') + '</ul>' : '<p class="hint">None</p>') + '</div>';
    };
    html += sec("c-miss", "You're missing", r.missing.map(function(i){
      var t = theirs[i];
      return '<li>' + modLink(t) + (t.workshopId ? '' : ' <span class="tag">local mod</span>') + '</li>';
    }));
    html += sec("c-extra", "Only you have", r.extra.map(function(i){ return '<li>' + modLink(mine[i]) + '</li>'; }));
    html += sec("c-move", "Different order", r.moved.map(function(p){
      return '<li>' + modLink(mine[p.mine]) + ' <span class="hint">yours: ' + (p.mine + 1) + ', theirs: ' + (p.theirs + 1) + '</span></li>';
    }));
  }
  return html;
}

function compareHtml(){
  return '<div class="panel" id="cmp"><h2>Compare with another list</h2>' +
    '<div class="drop" id="drop"><textarea id="cmp-in" placeholder="Paste their import code, Discord post, or Mods= server line here, or drop their ModList.html onto this box"></textarea></div>' +
    '<div class="bar" style="margin:10px 0 0"><button id="cmp-go">Compare</button>' +
    '<button id="cmp-file">Choose file...</button><input type="file" id="cmp-pick" accept=".html,.htm,.txt" style="display:none"></div>' +
    '<p class="err" id="cmp-err" style="display:none"></p><div id="cmp-out"></div></div>';
}

function wireCompare(mine){
  var input = $("cmp-in"), err = $("cmp-err"), out = $("cmp-out"), view = "side", last = null;
  function showErr(msg){ err.textContent = msg; err.style.display = msg ? "block" : "none"; }
  function draw(){
    if (!last) return;
    out.innerHTML = renderCompare(mine, last.theirs, last.r, view);
    $("v-side").onclick = function(){ view = "side"; draw(); };
    $("v-sum").onclick = function(){ view = "sum"; draw(); };
    $("lm-steam").onclick = function(){ store(LINK_KEY, "steam"); draw(); };
    $("lm-browser").onclick = function(){ store(LINK_KEY, "browser"); draw(); };
    var cm = $("cp-miss");
    if (cm) cm.onclick = function(){
      var lines = last.r.missing.map(function(i){ var t = last.theirs[i];
        return t.workshopId ? t.name + " - " + WS + t.workshopId : t.name + " (local mod, no Workshop page)"; });
      copyText(lines.join("\n"), cm, null, "Copy missing links");
    };
  }
  function run(text){
    var theirs = parseList(text);
    if (!theirs || !theirs.length) {
      showErr("Couldn't read a mod list from that. Paste an import code, a Discord post from Mod List Exporter, a Mods= line, or drop a ModList.html.");
      out.innerHTML = ""; last = null; return;
    }
    showErr("");
    last = { theirs: theirs, r: compareLists(mine, theirs) };
    draw();
  }
  function readFile(f){ var fr = new FileReader(); fr.onload = function(){ input.value = ""; run(fr.result); }; fr.readAsText(f); }
  $("cmp-go").onclick = function(){ run(input.value); };
  $("cmp-file").onclick = function(){ $("cmp-pick").click(); };
  $("cmp-pick").onchange = function(){ if (this.files[0]) readFile(this.files[0]); this.value = ""; };
  var drop = $("drop");
  drop.addEventListener("dragover", function(e){ e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", function(){ drop.classList.remove("over"); });
  drop.addEventListener("drop", function(e){
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
    else run(e.dataTransfer.getData("text"));
  });
}

// ------------------------------------------------------- steam collection

// Accepts a collection link (filedetails or managecollection) or a bare ID.
function collectionId(text){
  text = String(text || "").trim();
  if (!text) return "";
  var m = text.match(/[?&]id=(\d{5,})/) || text.match(/^(\d{5,})$/);
  return m ? m[1] : null;
}

// One entry per Workshop item (mods sharing an item are grouped), sorted A to Z.
function workshopItems(mods){
  var byId = {}, items = [];
  (mods || []).forEach(function(m){
    if (!m.workshopId) return;
    var it = byId[m.workshopId];
    if (!it) { it = byId[m.workshopId] = { id: m.workshopId, names: [] }; items.push(it); }
    if (it.names.indexOf(m.name) < 0) it.names.push(m.name);
  });
  items.forEach(function(it){ it.title = it.names[0]; });
  items.sort(function(a, b){ return a.title.localeCompare(b.title, undefined, { sensitivity: "base", numeric: true }); });
  return items;
}

function loadAdded(){ try { return JSON.parse(load(ADDED_KEY) || "{}") || {}; } catch (e) { return {}; } }
function saveAdded(o){ store(ADDED_KEY, JSON.stringify(o)); }

function collectionHtml(items, current){
  var n = items.length;
  var rows = items.map(function(it){
    var sub = it.names.length > 1 ? '<small>One Workshop item, ' + it.names.length + ' mods: ' + esc(it.names.join(", ")) + '</small>' : '';
    return '<label class="ckr" data-id="' + it.id + '"><input type="checkbox" data-id="' + it.id + '">' +
      '<span class="nm">' + esc(it.title) + sub + '</span>' +
      '<a class="wid" href="' + WS + it.id + '" target="_blank" rel="noopener">' + it.id + '</a></label>';
  }).join('');
  return '<div class="coll"><h3>Steam collection <span>optional, gives everyone a Subscribe to all button</span></h3>' +
    '<div class="step"><span class="num">1</span><div class="body"><a class="btn" href="' + NEW_COLLECTION + '" target="_blank" rel="noopener">Create collection on Steam</a>' +
      '<p class="hint">Set its visibility to <b>Unlisted</b> so it stays out of Workshop search but works for anyone with the link. Public also works.</p></div></div>' +
    '<div class="step"><span class="num">2</span><div class="body">In Steam\'s editor, open <b>Add from your subscribed items</b>. Steam lists <b>all</b> your subscribed Project Zomboid items: click <b>Add</b> only on the ones in this list.' +
      '<div class="bar" style="margin:8px 0 0"><button id="ck-show">Show my ' + n + ' items as a checklist</button><button id="ck-ids">Copy all Workshop IDs</button></div>' +
      '<div class="ck" id="ck"><div class="ckh"><span id="ck-count"></span><div class="prog"><div id="ck-bar"></div></div><button id="ck-clear" style="font-size:12px;padding:2px 8px">Clear ticks</button></div><div class="ckrows">' + rows + '</div></div>' +
      '<p class="hint">Ticks are only for keeping track. They\'re saved in this browser, and nothing is sent to Steam.</p></div></div>' +
    '<div class="step"><span class="num">3</span><div class="body">Paste the collection link' +
      '<div class="namerow"><input id="coll" type="text" placeholder="https://steamcommunity.com/sharedfiles/filedetails/?id=..." value="' + esc(current) + '"></div>' +
      '<p class="err" id="coll-err" style="display:none">That doesn\'t look like a Steam collection link. Paste the address of your collection\'s page.</p>' +
      '<p class="warn">Make sure your collection has exactly these ' + n + ' items. Extras would get subscribed for everyone who uses Subscribe to all.</p>' +
      '<p class="hint">Remembered for next time. Leave empty to skip.</p></div></div></div>';
}

function wireCollection(items){
  var added = loadAdded();
  function refresh(){
    var done = 0;
    items.forEach(function(it){ if (added[it.id]) done++; });
    $("ck-count").textContent = done + " of " + items.length + " added";
    $("ck-bar").style.width = (items.length ? Math.round(done / items.length * 100) : 0) + "%";
    Array.prototype.forEach.call(document.querySelectorAll("#ck .ckr"), function(row){
      var on = !!added[row.getAttribute("data-id")];
      row.classList.toggle("done", on);
      row.querySelector("input").checked = on;
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#ck input"), function(cb){
    cb.onchange = function(){ var id = cb.getAttribute("data-id"); if (cb.checked) added[id] = 1; else delete added[id]; saveAdded(added); refresh(); };
  });
  $("ck-clear").onclick = function(){ added = {}; saveAdded(added); refresh(); };
  $("ck-show").onclick = function(){
    var open = !$("ck").classList.contains("open");
    $("ck").classList.toggle("open", open);
    this.classList.toggle("on", open);
  };
  $("ck-ids").onclick = function(){ copyText(items.map(function(it){ return it.id; }).join(";"), $("ck-ids")); };
  $("coll").oninput = function(){ $("coll-err").style.display = collectionId(this.value) === null ? "block" : "none"; };
  refresh();
}

function bannerHtml(data){
  if (!data.collection) return "";
  return '<div class="banner"><a class="big" href="' + WS + data.collection + '" target="_blank" rel="noopener">Subscribe to all on Steam</a>' +
    '<p>Opens this list\'s Steam collection (<a href="' + STEAM_APP + data.collection + '">open in the Steam app</a>). ' +
    'Then in game, use <b>Import</b> with this list\'s import code to turn them on in the right order.</p></div>';
}

// ------------------------------------------------------------------ page

var PANELS = { dlp: "dl", parts: "dc", cmp: "cm" };   // panel id -> its button
function togglePanel(id){
  Object.keys(PANELS).forEach(function(p){
    var el = $(p), b = $(PANELS[p]);
    var open = p === id && !el.classList.contains("open");
    el.classList.toggle("open", open); b.classList.toggle("on", open);
  });
}

function show(data){
  var parts = renderList(data);
  var dparts = discordParts(data);
  var title = listTitle(data);
  document.title = title;
  var nameVal = data.title || load(NAME_KEY);
  var asIndex = load(INDEX_KEY) === "1";
  var items = workshopItems(data.mods);
  var collVal = data.collection ? WS + data.collection : load(COLL_KEY);
  $("app").innerHTML = '<h1 id="h1">' + esc(title) + '</h1><p class="sub">' + parts.sub + '</p>' + bannerHtml(data) +
    '<div class="bar"><button id="dl">Download as .html</button><button id="dc">Copy for Discord</button>' +
    '<button id="ic">Copy import code</button><button id="cm">Compare</button></div>' +
    '<div class="panel" id="dlp"><h2>Download as .html</h2>' +
    '<label for="lname" style="margin-top:0">List name (shows in the page title and the Discord card)</label>' +
    '<div class="namerow"><input id="lname" type="text" maxlength="80" placeholder="' + DEFAULT_TITLE + '" value="' + esc(nameVal) + '"></div>' +
    '<label class="tick"><input type="checkbox" id="asidx"' + (asIndex ? ' checked' : '') + '><span>Save as <b>index.html</b> instead of ModList.html</span></label>' +
    '<p class="hint">Use index.html when uploading to a hosting site: the list then opens at your site\'s main address.</p>' +
    (items.length ? collectionHtml(items, collVal) : '') +
    '<div class="bar" style="margin:16px 0 0"><button id="dlgo">Download <span id="dlname"></span></button></div></div>' +
    discordHtml(dparts) + compareHtml() + parts.list + parts.config;
  function fileName(){ return $("asidx").checked ? "index.html" : "ModList.html"; }
  function updateName(){ $("dlname").textContent = fileName(); }
  updateName();
  $("asidx").onchange = function(){ store(INDEX_KEY, this.checked ? "1" : "0"); updateName(); };
  $("dl").onclick = function(){ togglePanel("dlp"); if ($("dlp").classList.contains("open")) $("lname").focus(); };
  if (items.length) wireCollection(items);
  $("dlgo").onclick = function(){
    var name = $("lname").value.trim();
    var coll = $("coll") ? collectionId($("coll").value) : "";
    if (coll === null) { $("coll-err").style.display = "block"; $("coll").focus(); return; }
    store(NAME_KEY, name);
    if ($("coll")) store(COLL_KEY, coll ? WS + coll : "");
    var copy = {};
    for (var k in data) copy[k] = data[k];
    copy.title = name;
    if (coll) copy.collection = coll; else delete copy.collection;
    download(copy, fileName());
  };
  $("ic").onclick = function(){ copyText(importCode(data), $("ic")); };
  $("dc").onclick = function(){
    togglePanel("parts");
    if ($("parts").classList.contains("open") && dparts.length === 1) {
      var b = $("parts").querySelector("button"); copyText(dparts[0], b, $("parts").querySelector("textarea"));
    }
  };
  $("cm").onclick = function(){ togglePanel("cmp"); if ($("cmp").classList.contains("open")) $("cmp-in").focus(); };
  Array.prototype.forEach.call(document.querySelectorAll("#parts button"), function(b){
    var i = +b.getAttribute("data-i");
    b.onclick = function(){ copyText(dparts[i], b, b.parentNode.nextElementSibling); };
  });
  wireCompare(data.mods || []);
}

function showMissing(){
  $("app").innerHTML = '<h1>Project Zomboid Mod List</h1>' +
    '<div class="empty">No exported list found yet. In Project Zomboid, open the mod load order screen, click <b>Export</b>, then <b>Export HTML</b>, and reload this page.</div>';
}

function tryLoad(i){
  if (window.MODLIST) { show(window.MODLIST); return; }
  if (i >= CANDIDATES.length) { showMissing(); return; }
  var s = document.createElement("script");
  s.src = CANDIDATES[i] + "?t=" + Date.now();
  s.onload = s.onerror = function(){ tryLoad(i + 1); };
  document.body.appendChild(s);
}
tryLoad(0);
</script></body></html>
